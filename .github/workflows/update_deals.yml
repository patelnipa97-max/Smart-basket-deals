name: Weekly Deal Scraper

on:
  schedule:
    - cron: '0 6 * * 3' # Runs automatically every Wednesday at 6:00 AM UTC
  workflow_dispatch: # Allows you to click a button and run it manually anytime!

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run scraper script
        run: python scraper.py

      - name: Commit and push updated deals.json
        run: |
          git config --global user.name "Deal Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add deals.json
          git commit -m "Auto-update weekly grocery deals [skip ci]" || exit 0
          git push
